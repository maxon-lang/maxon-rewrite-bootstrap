# The gate on the hosts GitHub runs: x64 Linux and arm64 macOS run `./check.sh`, arm64 Linux, which has no seed, runs natively
# the lanes of a compiler that the x64 Linux job cross-built, and x64 Windows runs the lanes of its own target
# (`gate check --host-only`: the runner has no WSL distribution, qemu or Mac, and the run names each step it leaves out)
# (README, "Continuous integration").
name: ci

on:
  push:
    branches: [main, proven-access, "cloud/**", "eric-pc/**"]
  pull_request:
  workflow_dispatch:

# Every commit of main is run to its end, since several machines push there and a superseded run would never finish;
# on any other branch a newer push replaces the run of an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The module has no dependencies and so no go.sum; the build cache is keyed by go.mod instead.
          cache-dependency-path: go.mod
      - name: Gate
        run: ./check.sh
      # The compiler the gate built (bin/minimaxon) builds itself for arm64 Linux; the arm64 job runs it, and finds runtime/
      # and stdlib/ in its own checkout, as the compiler finds them by walking up from its executable.
      - name: Cross-build the compiler for arm64 Linux
        env:
          MINIMAXON_CACHE: "off"
        run: ./bin/minimaxon build self --target=arm64-linux -o bin/minimaxon-arm64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: minimaxon-arm64-linux
          path: bin/minimaxon-arm64-linux
          if-no-files-found: error
          retention-days: 7

  linux-arm64:
    needs: linux-x64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: minimaxon-arm64-linux
          path: bin
      # An artifact keeps no file mode.
      - name: Make the compiler executable
        run: chmod +x bin/minimaxon-arm64-linux
      # The compiler's own suites, and the corpus and the behaviours reruns for arm64-linux, run natively (cmd/gate, armLinuxLanes).
      - name: Lanes
        run: go run ./cmd/gate suites bin/minimaxon-arm64-linux

  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Gate
        run: ./check.sh

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The runner's git converts line endings (its system config has core.autocrlf=true), and the repository's files are as committed:
      # a layout check rejects a carriage return. Its long paths are already on (LongPathsEnabled), and git is asked for them too.
      - name: Git settings
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      # The runner has no WSL, qemu or Mac, so the gate runs only the lanes of x64 Windows, names each step it leaves out and
      # still compiles for the other targets (cmd/gate, ownLanes).
      - name: Gate
        run: go run ./cmd/gate check --host-only
